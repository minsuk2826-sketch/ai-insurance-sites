
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <title>A+에셋 사업설명회</title>
  <meta name="description" content="서면 정준호 뷔페에서 맛있는 식사와 함께하는 보험 사업설명회. 참석자 45명 정원. 롯데백화점 상품권 5만원 안내.">

  <meta property="og:type" content="website">
  <meta property="og:title" content=" ">
  <meta property="og:description" content="장소: 서면 정준호 뷔페(참석자 45명 정원) | 참석자 전원 롯데백화점 상품권 5만원">
  <meta property="og:image" content="https://aplus-recruit.vercel.app/og-image.png">
  <meta property="og:image:width" content="1648">
  <meta property="og:image:height" content="928">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
    }

    body {
      background: #f2f3f8;
      font-family: system-ui, 'Malgun Gothic', sans-serif;
    }

    body.form-open {
      overflow: hidden;
    }

    .wrap {
      width: min(100%, 720px);
      margin: auto;
      background: white;
      box-shadow: 0 4px 28px #0001;
    }

    .panel img {
      width: 100%;
      height: auto;
      display: block;
    }

    .last {
      position: relative;
    }

    /* 기존 이미지의 분홍색 신청 버튼 위치 */
 .apply-button {
  position: absolute;
  z-index: 5;
  left: 4%;
  top: 65%;
  width: 52%;
  height: 29%;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 0;
  color: transparent;
}

/* 오른쪽 카카오톡 이미지 전체 클릭 영역 */
.kakao {
  position: absolute;
  z-index: 5;
  left: 58%;
  top: 65%;
  width: 39%;
  height: 29%;
  border-radius: 12px;
}

    .apply-button:focus-visible,
    .kakao:focus-visible {
      outline: 3px solid #1164e9;
      outline-offset: -3px;
    }

    /* 신청서 팝업 */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .65);
    }

    .modal.open {
      display: flex;
    }

    .dialog {
      position: relative;
      width: min(100%, 480px);
      max-height: 94dvh;
      overflow-y: auto;
      background: #fff;
      border-radius: 20px;
      padding: 30px 26px;
      box-shadow: 0 20px 60px #0004;
    }

    .close-button {
      position: absolute;
      right: 16px;
      top: 14px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #f0f2f6;
      color: #333;
      font-size: 26px;
      cursor: pointer;
    }

    .dialog h2 {
      margin: 0 40px 8px 0;
      font-size: 25px;
      color: #142447;
    }

    .intro {
      margin: 0 0 24px;
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #26364d;
    }

    .field input,
    .field select {
      display: block;
      width: 100%;
      height: 54px;
      padding: 0 15px;
      border: 1px solid #cbd3df;
      border-radius: 11px;
      background: #fff;
      color: #202939;
      font: inherit;
      font-size: 16px;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid #2057c8;
      border-color: #2057c8;
    }

    .agree {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0 12px;
      font-size: 14px;
      color: #344054;
      line-height: 1.5;
      cursor: pointer;
    }

    .agree input {
      width: 20px;
      height: 20px;
      margin: 0;
      flex: none;
      accent-color: #e91b70;
    }

    .privacy-info {
      margin: 0 0 22px;
      padding: 12px;
      background: #f6f7fa;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.7;
      color: #596579;
    }

    .submit-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      background: #e91b70;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .result {
      margin: 14px 0 0;
      color: #ad123c;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      min-height: 1em;
    }

    .success {
      display: none;
      text-align: center;
      padding: 25px 0;
    }

    .success.show {
      display: block;
    }

    .success-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e7f7ed;
      color: #159447;
      font-size: 40px;
      font-weight: 800;
    }

    .success p {
      color: #667085;
      line-height: 1.7;
    }

    .done-button {
      margin-top: 16px;
      padding: 14px 40px;
      border: 0;
      border-radius: 10px;
      background: #164cbd;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 모바일에서는 신청서 전체 화면 */
    @media (max-width: 600px) {
      .modal {
        padding: 0;
        align-items: stretch;
      }

      .dialog {
        width: 100%;
        max-height: 100dvh;
        height: 100dvh;
        border-radius: 0;
        padding: 28px 22px 40px;
        padding-top: max(28px, env(safe-area-inset-top));
        padding-bottom: max(40px, env(safe-area-inset-bottom));
        box-shadow: none;
      }

      .dialog h2 {
        font-size: 26px;
      }

      .field input,
      .field select {
        height: 58px;
        font-size: 17px;
      }

      .submit-button {
        min-height: 60px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <section class="panel">
      <img src="section1.png" alt="A+에셋 보험설계사 안내 첫 번째" loading="eager">
    </section>

    <section class="panel">
      <img src="section2.png" alt="A+에셋 보험설계사 안내 두 번째" loading="lazy">
    </section>

    <section class="panel">
      <img src="section3.png" alt="A+에셋 보험설계사 안내 세 번째" loading="lazy">
    </section>

    <section class="panel">
      <img src="section4.png" alt="A+에셋 보험설계사 안내 네 번째" loading="lazy">
    </section>

    <section class="panel">
      <img src="section5.png" alt="A+에셋 보험설계사 안내 다섯 번째" loading="lazy">
    </section>

    <section class="panel last">

      <img
        src="section6.png"
        alt="사업설명회 지원하기 및 카카오톡 상담 신청"
        loading="lazy"
      >

      <button
        class="apply-button"
        type="button"
        id="openForm"
        aria-label="사업설명회 지원하기"
      >
        사업설명회 지원하기
      </button>

      <a
        class="kakao"
        id="kakao"
        href="https://open.kakao.com/o/sPtglPDi"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="카카오톡 상담하기"
      ></a>

    </section>

  </main>

  <!-- 큰 신청서 팝업 -->
  <div
    class="modal"
    id="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle"
  >

    <div class="dialog">

      <button
        type="button"
        class="close-button"
        id="closeForm"
        aria-label="닫기"
      >×</button>

      <form id="leadForm">

        <h2 id="dialogTitle">사업설명회 참가 신청</h2>

        <p class="intro">
          간단한 정보를 입력해 주세요.<br>
          담당자가 확인 후 참석 안내를 드립니다.
        </p>

        <div class="field">
          <label for="name">이름</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="이름을 입력해주세요"
            autocomplete="name"
            maxlength="40"
            required
          >
        </div>

        <div class="field">
          <label for="phone">연락처</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="010-0000-0000"
            maxlength="13"
            required
          >
        </div>

        <div class="field">
          <label for="age">연령대</label>
          <select id="age" name="age" required>
            <option value="">연령대를 선택해주세요</option>
            <option>20대</option>
            <option>30대</option>
            <option>40대</option>
            <option>50대</option>
            <option>60대 이상</option>
          </select>
        </div>

        <div class="field">
          <label for="region">거주지역</label>
          <select id="region" name="region" required>
            <option value="">거주지역을 선택해주세요</option>
            <option>부산</option>
            <option>김해</option>
            <option>양산</option>
            <option>경남 기타</option>
            <option>울산</option>
            <option>기타 지역</option>
          </select>
        </div>

        <label class="agree">
          <input type="checkbox" id="inlineAgree" required>
          <span>개인정보 수집 및 이용에 동의합니다 (필수)</span>
        </label>

        <div class="privacy-info">
          수집 항목: 이름, 연락처, 연령대, 거주지역<br>
          이용 목적: 사업설명회 참가 신청 및 참석 안내<br>
          ※ 실제 운영 전 개인정보 처리 주체와 보유 기간을 명시해 주세요.
        </div>

        <button
          class="submit-button"
          type="submit"
          id="submitButton"
        >
          사업설명회 신청하기
        </button>

        <p class="result" id="result" role="status"></p>

      </form>

      <div class="success" id="success">
        <div class="success-icon">✓</div>
        <h2>신청이 완료되었습니다.</h2>
        <p>
          사업설명회 신청이 정상 접수되었습니다.<br>
          담당자가 확인 후 연락드리겠습니다.
        </p>
        <button class="done-button" type="button" id="done">
          확인
        </button>
      </div>

    </div>

  </div>

  <script src="./config.js"></script>

  <script>
    (() => {

      const modal = document.getElementById('modal');
      const form = document.getElementById('leadForm');
      const result = document.getElementById('result');
      const success = document.getElementById('success');
      const submitButton = document.getElementById('submitButton');
      const agree = document.getElementById('inlineAgree');
      const kakao = document.getElementById('kakao');

      const cfg = window.LANDING_CONFIG || {};

      if (cfg.kakaoUrl?.startsWith('https://')) {
        kakao.href = cfg.kakaoUrl;
      }

      function openModal() {
        modal.classList.add('open');
        document.body.classList.add('form-open');

        setTimeout(() => {
          document.getElementById('name').focus();
        }, 100);
      }

      function closeModal() {
        modal.classList.remove('open');
        document.body.classList.remove('form-open');
      }

      document.getElementById('openForm').addEventListener('click', openModal);

      document.getElementById('closeForm').addEventListener('click', closeModal);

      document.getElementById('done').addEventListener('click', () => {
        closeModal();
        form.reset();
        form.style.display = 'block';
        success.classList.remove('show');
        result.textContent = '';
      });

      modal.addEventListener('click', e => {
        if (e.target === modal) closeModal();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
      });

      const phoneInput = document.getElementById('phone');

      phoneInput.addEventListener('input', e => {
        let v = e.target.value.replace(/\D/g, '').slice(0, 11);

        if (v.length < 4) {
          e.target.value = v;
        } else if (v.length < 8) {
          e.target.value = v.replace(/(\d{3})(\d+)/, '$1-$2');
        } else {
          e.target.value = v.replace(/(\d{3})(\d{4})(\d+)/, '$1-$2-$3');
        }
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();

        if (!agree.checked) {
          result.textContent = '개인정보 수집 및 이용 동의가 필요합니다.';
          return;
        }

        if (!cfg.supabaseAnonKey) {
          result.textContent = 'CRM 연결 설정을 확인해 주세요.';
          return;
        }

        const name = form.elements.namedItem('name').value.trim();
        const phone = form.elements.namedItem('phone').value.replace(/\D/g, '');
        const age_group = form.elements.namedItem('age').value;
        const region = form.elements.namedItem('region').value;

        if (!/^01[016789]\d{7,8}$/.test(phone)) {
          result.textContent = '휴대전화 번호를 확인해 주세요.';
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = '신청 접수 중...';
        result.textContent = '';

        try {

          const response = await fetch(
            'https://pzlxrlkvbrufhimyglyo.supabase.co/rest/v1/customers',
            {
              method: 'POST',
              headers: {
                'apikey': cfg.supabaseAnonKey,
                'Authorization': 'Bearer ' + cfg.supabaseAnonKey,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify({
                name,
                phone,
                age_group,
                status: '신규',
                source: 'A+에셋 사업설명회 랜딩',
                memo: '거주지역: ' + region
              })
            }
          );

          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }

          form.style.display = 'none';
          success.classList.add('show');

        } catch (err) {
          console.error(err);
          result.textContent =
            '신청 접수에 실패했습니다. 잠시 후 다시 시도해 주세요.';
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = '사업설명회 신청하기';
        }

      });

    })();
  </script>

</body>
</html>
