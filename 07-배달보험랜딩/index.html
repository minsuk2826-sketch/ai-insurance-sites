<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:type" content="website"><meta property="og:title" content="맛있는 식사와 함께하는 보험 사업설명회"><meta property="og:description" content="장소: 서면 정준호 뷔페(참석자 45명 정원) | 참석자 전원 롯데백화점 상품권 5만원"><meta property="og:image" content="https://aplus-recruit.vercel.app/og-image.png"><meta property="og:image:width" content="1648"><meta property="og:image:height" content="928">
<style>
*{box-sizing:border-box}html,body{margin:0}body{background:#f2f3f8;font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{width:min(100%,720px);margin:auto;background:white;box-shadow:0 4px 28px #0001}.panel img{width:100%;height:auto;display:block}.last{position:relative}.image-form{position:absolute;inset:0;margin:0}.image-form input,.image-form select{position:absolute;z-index:2;background:#fff;border:1px solid #a9b2c5;border-radius:4px;color:#18223b;font:inherit;font-size:clamp(9px,2.15vw,15px);padding:0 1.2%;height:2.9%;min-height:0;outline-offset:1px}.image-form input:focus,.image-form select:focus{outline:2px solid #184fba}.name{left:18.1%;top:68.8%;width:36.9%}.phone{left:18.1%;top:72.6%;width:36.9%}.age{left:18.1%;top:76.4%;width:24.3%}.region{left:18.1%;top:80.2%;width:24.3%}.inline-consent{position:absolute;z-index:4;left:18%;top:83.1%;width:38%;display:flex;align-items:center;gap:4px;font-size:clamp(8px,1.5vw,12px);font-weight:700;color:#15224a;white-space:nowrap;background:rgba(255,255,255,.94);border-radius:4px;padding:2px 3px}.image-form .inline-consent input{position:static;width:clamp(12px,2.4vw,17px);height:clamp(12px,2.4vw,17px);margin:0;flex:none;accent-color:#164cbd}.image-form .submit{position:absolute;left:4.4%;top:85.8%;width:50.7%;height:8.1%;border:0;background:transparent;cursor:pointer;color:transparent;font-size:0}.image-form .submit:focus-visible,.kakao:focus-visible{outline:3px solid #1164e9;outline-offset:-3px}.kakao{position:absolute;left:59.6%;top:87.1%;width:36.4%;height:6.1%;z-index:2;border-radius:12px}.status{position:absolute;top:94.5%;left:4%;width:92%;text-align:center;font-size:clamp(10px,2.3vw,15px);color:#a20d37;background:#fffdf9;border-radius:4px;margin:0;display:none;padding:4px}.status.visible{display:block}.modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{background:#fff;border-radius:16px;padding:24px;width:min(100%,440px);box-shadow:0 15px 40px #0004}.dialog h2{margin:0 0 12px;font-size:21px}.dialog p{line-height:1.55;color:#444;font-size:14px}.agree{display:flex;align-items:flex-start;gap:9px;font-size:14px;line-height:1.5;margin:16px 0}.agree input{margin-top:3px;flex:none}.actions{display:flex;gap:8px}.actions button{padding:13px;border:0;border-radius:9px;font-weight:700;cursor:pointer;flex:1}.cancel{background:#e9edf3}.confirm{background:#e91b70;color:white}.confirm:disabled{opacity:.5}.result{margin-top:12px;color:#ad123c;font-size:14px;min-height:1em}
</style></head><body><main class="wrap">
<section class="panel"><img src="section1.png" alt="A+에셋 보험설계사 안내 첫 번째" loading="eager"></section>
<section class="panel"><img src="section2.png" alt="A+에셋 보험설계사 안내 두 번째" loading="lazy"></section>
<section class="panel"><img src="section3.png" alt="A+에셋 보험설계사 안내 세 번째" loading="lazy"></section>
<section class="panel"><img src="section4.png" alt="A+에셋 보험설계사 안내 네 번째" loading="lazy"></section>
<section class="panel"><img src="section5.png" alt="A+에셋 보험설계사 안내 다섯 번째" loading="lazy"></section>
<section class="panel last"><img src="section6.png" alt="사업설명회 지원하기 및 카카오톡 상담 신청" loading="lazy">
<form id="leadForm" class="image-form" aria-label="사업설명회 신청서">
<input class="name" name="name" aria-label="이름" placeholder="이름을 입력해주세요" autocomplete="name" required maxlength="40">
<input class="phone" name="phone" aria-label="연락처" placeholder="010-0000-0000" type="tel" inputmode="tel" autocomplete="tel" required maxlength="13">
<select class="age" name="age" aria-label="나이" required><option value="">선택</option><option>20대</option><option>30대</option><option>40대</option><option>50대</option><option>60대 이상</option></select>
<select class="region" name="region" aria-label="거주지역" required><option value="">선택</option><option>부산</option><option>김해</option><option>양산</option><option>경남 기타</option><option>울산</option><option>기타 지역</option></select>
<label class="inline-consent"><input type="checkbox" id="inlineAgree" required><span>개인정보 수집 및 이용에 동의합니다 (필수)</span></label>
<button type="submit" class="submit" aria-label="사업설명회 지원하기">사업설명회 지원하기</button>
<p class="status" id="status" role="status"></p></form>
<a class="kakao" id="kakao" href="https://open.kakao.com/o/sPtglPDi" target="_blank" rel="noopener noreferrer" aria-label="카카오톡 상담하기"></a>
</section></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle">사업설명회 신청 확인</h2><p>신청하신 연락처로 참석 안내를 드립니다.</p><p><strong>수집 항목:</strong> 이름, 연락처, 연령대, 거주지역<br><strong>이용 목적:</strong> 사업설명회 참석 접수 및 연락</p><p style="font-size:13px">신청서에서 개인정보 수집·이용에 동의하셨습니다.</p><p style="font-size:12px">※ 운영 전 개인정보 처리 주체와 보유 기간을 추가해 주세요.</p><div class="actions"><button type="button" class="cancel" id="cancel">취소</button><button type="button" class="confirm" id="confirm">신청 완료하기</button></div><div class="result" id="result" role="status"></div></div></div>
<script src="./config.js"></script><script>
(()=>{const form=document.getElementById('leadForm'),modal=document.getElementById('modal'),status=document.getElementById('status'),result=document.getElementById('result'),confirm=document.getElementById('confirm'),agree=document.getElementById('inlineAgree');const cfg=window.LANDING_CONFIG||{};const kakao=document.getElementById('kakao');if(cfg.kakaoUrl?.startsWith('https://'))kakao.href=cfg.kakaoUrl;
function show(s){status.textContent=s;status.classList.add('visible')};function close(){modal.classList.remove('open');document.body.style.overflow=''};
form.addEventListener('submit',e=>{e.preventDefault();status.classList.remove('visible');result.textContent='';modal.classList.add('open');document.body.style.overflow='hidden'});
document.getElementById('cancel').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
confirm.addEventListener('click',async()=>{if(!agree.checked){result.textContent='개인정보 수집·이용 동의가 필요합니다.';return}if(!cfg.supabaseAnonKey){result.textContent='접수 연결 설정을 확인해 주세요.';return}const name=form.elements.name.value.trim(),phone=form.elements.phone.value.replace(/\D/g,''),age_group=form.elements.age.value,region=form.elements.region.value;if(!/^01[016789]\d{7,8}$/.test(phone)){result.textContent='휴대전화 번호를 확인해 주세요.';return}confirm.disabled=true;result.textContent='접수 중입니다…';try{const response=await fetch('https://pzlxrlkvbrufhimyglyo.supabase.co/rest/v1/customers',{method:'POST',headers:{'apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({name,phone,age_group,status:'신규',source:'A+에셋 사업설명회 랜딩',memo:'거주지역: '+region})});if(!response.ok)throw Error('HTTP '+response.status);close();form.reset();show('신청이 접수되었습니다. 담당자가 연락드리겠습니다.')}catch(e){result.textContent='접수에 실패했습니다. 잠시 후 다시 시도해 주세요.';console.error(e)}finally{confirm.disabled=false}});
})();
</script></body></html>
