<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A+에셋 사업설명회</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f9;font-family:Arial,'Malgun Gothic',sans-serif;color:#142342}.wrap{max-width:720px;margin:auto;background:white;box-shadow:0 4px 35px #15264b18}.panel img{display:block;width:100%;height:auto}.form-area{padding:26px 22px 34px;background:#f6f8ff}.form-area h2{text-align:center;color:#12377b;font-size:24px}.form-area p{text-align:center;color:#53617b;font-size:13px}label{display:block;font-weight:700;margin:15px 0 6px}input,select{width:100%;padding:14px;border:1px solid #c7cfdd;border-radius:10px;font-size:16px;background:white}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}.check input{width:auto;margin-top:2px}.cta{display:block;width:100%;padding:17px;background:#ef1670;color:white;font-size:18px;font-weight:800;border:0;border-radius:12px;margin-top:18px;cursor:pointer}.kakao{display:block;text-align:center;background:#fee500;color:#321c13;padding:17px;text-decoration:none;font-weight:800;border-radius:12px;margin-top:12px}.note{font-size:12px;color:#6b7280}#msg{text-align:center;font-size:14px;color:#a43b34;margin-top:12px}</style></head><body><main class="wrap"><section class="panel"><img src="section1.png" alt="A+에셋 신입 설계사 안내 1" loading="eager"></section><section class="panel"><img src="section2.png" alt="A+에셋 신입 설계사 안내 2" loading="lazy"></section><section class="panel"><img src="section3.png" alt="A+에셋 신입 설계사 안내 3" loading="lazy"></section><section class="panel"><img src="section4.png" alt="A+에셋 신입 설계사 안내 4" loading="lazy"></section><section class="panel"><img src="section5.png" alt="A+에셋 신입 설계사 안내 5" loading="lazy"></section><section class="panel"><img src="section6.png" alt="A+에셋 신입 설계사 안내 6" loading="lazy"></section><section class="form-area" id="apply"><h2>사업설명회 참가 신청</h2><p>신청 정보를 남겨주시면 담당자가 연락드립니다.</p><form id="form"><label for="name">이름</label><input id="name" required autocomplete="name"><label for="phone">연락처</label><input id="phone" type="tel" required placeholder="010-0000-0000" autocomplete="tel"><label for="age">연령대</label><select id="age" required><option value="">선택</option><option>20대</option><option>30대</option><option>40대</option><option>50대</option><option>60대 이상</option></select><label for="region">거주지역</label><input id="region" required placeholder="예: 부산 동래구"><label class="check"><input id="agree" type="checkbox" required>사업설명회 신청 및 연락을 위한 개인정보 수집·이용에 동의합니다. (수집 항목: 이름, 연락처, 연령대, 거주지역)</label><p class="note">운영 전 개인정보 처리 주체와 보유 기간을 명시해 주세요.</p><button class="cta" type="submit">사업설명회 지원하기</button><p id="msg" role="status"></p></form><a class="kakao" href="#" id="kakao">카카오톡 상담하기</a><p class="note"></p></section></main><script src="config.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');const btn=e.target.querySelector('button[type=submit]');const cfg=window.LANDING_CONFIG||{};if(!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('여기에')){m.textContent='접수 설정이 완료되지 않았습니다. 관리자에게 문의해 주세요.';return;}const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.replace(/[^0-9]/g,''),age_group=document.getElementById('age').value,region=document.getElementById('region').value.trim();if(!/^01[016789][0-9]{7,8}$/.test(phone)){m.textContent='휴대전화 번호를 확인해 주세요.';return;}btn.disabled=true;m.textContent='접수 중입니다…';try{const res=await fetch('https://pzlxrlkvbrufhimyglyo.supabase.co/rest/v1/customers',{method:'POST',headers:{'apikey':cfg.supabaseAnonKey,'Authorization':'Bearer '+cfg.supabaseAnonKey,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({name,phone,age_group,source:'A+에셋 사업설명회 랜딩',status:'신규',memo:'거주지역: '+region})});if(!res.ok)throw new Error('접수 실패 ('+res.status+')');m.textContent='신청이 접수되었습니다. 담당자가 연락드리겠습니다.';e.target.reset();}catch(err){m.textContent='접수가 완료되지 않았습니다. 잠시 후 다시 시도해 주세요.';}finally{btn.disabled=false;}});document.getElementById('kakao').addEventListener('click',e=>{const url=(window.LANDING_CONFIG||{}).kakaoUrl;if(url&&url.startsWith('https://')){e.currentTarget.href=url;return;}e.preventDefault();alert('카카오톡 상담 주소가 아직 설정되지 않았습니다.');});</script></body></html>
